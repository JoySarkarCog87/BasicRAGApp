<div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-75">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

                <div class="card-header bg-primary text-white text-center py-4 border-0">
                    <div class="mb-2">
                        <i class="bi bi-shield-lock-fill fs-1"></i>
                    </div>
                    <h4 class="fw-bold mb-0">Welcome Back</h4>
                    <p class="small text-white-50 mb-0">Sign in to BasicRAGApp</p>
                </div>

                <div class="card-body p-4 p-sm-5 bg-white">
                    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

                        <!-- Username/Email Field -->
                        <div class="mb-3">
                            <label for="identity" class="form-label fw-semibold small text-dark">Username or
                                Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" id="identity" class="form-control bg-light border-start-0 ps-0"
                                    placeholder="name@example.com or username" formControlName="email">
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small text-dark">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-key"></i>
                                </span>
                                <input [type]="showPassword ? 'text' : 'password'" id="password"
                                    class="form-control bg-light border-start-0 border-end-0 ps-0"
                                    placeholder="••••••••" formControlName="password">
                                <button class="btn btn-light border border-start-0 text-muted" type="button"
                                    (click)="togglePasswordVisibility()">
                                    <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Role Selection (Checkboxes) -->
                        <!-- <div class="mb-4" formGroupName="roles">
                            <label class="form-label fw-semibold small text-dark d-block mb-2">Select Roles</label>
                            <div class="d-flex gap-4 p-2 bg-light rounded-3 border">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="roleUser"
                                        formControlName="user">
                                    <label class="form-check-label small fw-semibold text-secondary" for="roleUser">
                                        <i class="bi bi-person-badge me-1"></i> User
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="roleAdmin"
                                        formControlName="admin">
                                    <label class="form-check-label small fw-semibold text-secondary" for="roleAdmin">
                                        <i class="bi bi-shield-check me-1"></i> Admin
                                    </label>
                                </div>
                            </div>
                        </div> -->

                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm"
                            [disabled]="loginForm.invalid">
                            {{pageMode}} <i class="bi bi-arrow-right-short ms-1"></i>
                        </button>
                    </form>

                    <!-- Divider -->
                    <div class="sso-divider text-center my-4">
                        <span class="small text-muted px-2">or continue with</span>
                    </div>

                    <!-- Okta SSO - primary route for enterprise accounts -->
                    <button type="button" class="btn btn-okta w-100 py-2 rounded-pill fw-bold d-flex align-items-center justify-content-center"
                        (click)="openOktaLogin()">
                        <svg class="okta-mark me-2" viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 14.5a4.5 4.5 0 110-9 4.5 4.5 0 010 9z" />
                        </svg>
                        Sign in with Okta
                        <span class="badge rounded-pill bg-white text-dark ms-2 fw-semibold sso-badge">SSO</span>
                    </button>
                    <p class="text-center text-muted mt-3 mb-0 sso-hint">
                        <i class="bi bi-shield-check me-1"></i> Single sign-on for organization accounts
                    </p>
                </div>

                <div class="card-footer bg-light text-center py-3 border-0">
                    <p class="small text-muted mb-0">
                        @if(pageMode=='Login'){
                            Don't have an account?
                        }@else{
                            Already have an account?
                        }
                        <button class="btn btn-link p-0 align-baseline fw-semibold text-decoration-none"
                        (click)="toggolePageMode()"
                        >
                        @if(pageMode=='Login'){
                            SignUp
                        }@else{
                            Login
                        }
                    </button>
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>
