<div class="container py-4 h-100">
  <!-- Top Stepper: Pipeline Progress -->
  <div class="card border-0 shadow-sm rounded-4 mb-4 bg-white">
    <div class="card-body p-3 p-md-4">
      <div class="d-flex align-items-center justify-content-between position-relative px-2 px-md-4">

        <!-- Background Connecting Line -->
        <div class="stepper-line"></div>

        <!-- Step 1: Upload Document -->
        <div class="text-center position-relative z-1">
          <label
            class="btn btn-sm btn-primary rounded-circle step-icon shadow-sm d-flex align-items-center justify-content-center cursor-pointer mb-2 mx-auto">
            <i class="bi bi-cloud-arrow-up-fill fs-5"></i>
            <input type="file" (change)="onFileUpload($event)" class="d-none"
              [disabled]="currentStep > 0 && currentStep < 5">
          </label>
          <span class="d-block small fw-bold text-dark">1. Upload</span>
        </div>

        <!-- Step 2: Document Chunking -->
        <div class="text-center position-relative z-1">
          <div class="step-icon rounded-circle d-flex align-items-center justify-content-center mb-2 mx-auto"
            [ngClass]="getStepClass(2)">
            <i class="bi" [ngClass]="getStepIcon(2, 'bi-scissors')"></i>
          </div>
          <span class="d-block small fw-bold text-dark">2. Chunking</span>
        </div>

        <!-- Step 3: Generating Embeddings -->
        <div class="text-center position-relative z-1">
          <div class="step-icon rounded-circle d-flex align-items-center justify-content-center mb-2 mx-auto"
            [ngClass]="getStepClass(3)">
            <i class="bi" [ngClass]="getStepIcon(3, 'bi-cpu-fill')"></i>
          </div>
          <span class="d-block small fw-bold text-dark">3. Embedding</span>
        </div>

        <!-- Step 4: Storing in Vector DB -->
        <div class="text-center position-relative z-1">
          <div class="step-icon rounded-circle d-flex align-items-center justify-content-center mb-2 mx-auto"
            [ngClass]="getStepClass(4)">
            <i class="bi" [ngClass]="getStepIcon(4, 'bi-database-fill-check')"></i>
          </div>
          <span class="d-block small fw-bold text-dark">4. Vector DB</span>
        </div>

        <!-- Step 5: Ready / All Complete -->
        <div class="text-center position-relative z-1">
          <div class="step-icon rounded-circle d-flex align-items-center justify-content-center mb-2 mx-auto"
            [ngClass]="getStepClass(5)">
            <i class="bi" [ngClass]="getStepIcon(5, 'bi-check-all')"></i>
          </div>
          <span class="d-block small fw-bold text-dark">5. Ready</span>
        </div>

      </div>
    </div>
  </div>

  <!-- Bottom Panel: Chat Window -->
  <div class="card border-0 shadow-lg rounded-4 overflow-hidden chat-card">

    <!-- Chat Header -->
    <div class="card-header bg-primary text-white p-3 d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center">
        <div class="bg-white text-primary rounded-circle p-2 me-2 d-flex align-items-center justify-content-center"
          style="width: 38px; height: 38px;">
          <i class="bi bi-robot fs-5"></i>
        </div>
        <div>
          <h6 class="mb-0 fw-bold">BasicRAG Assistant</h6>
          <small class="text-white-50">
            <i class="bi bi-circle-fill text-success fs-7 me-1"></i>
            {{ isReady ? 'Document Indexed & Ready' : 'Awaiting Document Upload' }}
          </small>
        </div>
      </div>
      <button class="btn btn-sm btn-outline-light rounded-pill px-3" (click)="resetPipeline()" title="Reset Session">
        <i class="bi bi-arrow-clockwise me-1"></i> Reset
      </button>
    </div>

    <!-- Messages Container -->
    <div class="card-body p-4 chat-body bg-light" #scrollContainer>
      @for (msg of messages(); track $index) {
        
      <div [ngClass]="{'text-end': msg.sender === 'user'}" class="mb-3">
       
        @if (msg.sender === 'bot') {
        <!-- Bot Message Bubble -->
         
        <div class="d-flex align-items-start gap-2">
          
          <div class="bg-primary text-white rounded-circle p-2 flex-shrink-0"
            style="width: 32px; height: 32px; display: grid; place-items: center;">
            <i class="bi bi-robot small"></i>
            
          </div>
          <div class="bg-white p-3 rounded-4 shadow-sm border text-start max-w-75">
            <p class="mb-0 text-dark small">{{ msg.text }}</p>
            <span class="text-muted fs-7 d-block mt-1">{{ msg.time }}</span>
          </div>
        </div>
        } @else {
        <!-- User Message Bubble -->
        <div class="d-flex align-items-start justify-content-end gap-2">
          <div class="bg-primary text-white p-3 rounded-4 shadow-sm text-start max-w-75">
            <p class="mb-0 small">{{ msg.text }}</p>
            <span class="text-white-50 fs-7 d-block mt-1 text-end">{{ msg.time }}</span>
          </div>
          <div class="bg-secondary text-white rounded-circle p-2 flex-shrink-0"
            style="width: 32px; height: 32px; display: grid; place-items: center;">
            <i class="bi bi-person-fill small"></i>
          </div>
        </div>
        }

      </div>
    }
    </div>

    <!-- Chat Input Bar -->
    <div class="card-footer bg-white p-3 border-0">
      <form (ngSubmit)="sendMessage()" class="d-flex gap-2">
        <input type="text" class="form-control rounded-pill bg-light border-0 px-4"
          placeholder="Ask anything about your document..." [(ngModel)]="userInput" name="userInput"
          [disabled]="!isReady">
        <button type="submit"
          class="btn btn-primary rounded-pill px-4 fw-bold d-flex align-items-center gap-2 shadow-sm"
          [disabled]="!isReady || !userInput.trim()">
          <span>Submit</span>
          <i class="bi bi-send-fill"></i>
        </button>
      </form>
    </div>

  </div>
</div>
